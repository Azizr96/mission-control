<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control | Pomodoro Timer &amp; Mission List</title>
  <meta name="description" content="Mission Control - a Pomodoro focus timer with a mission (task) list, built for the AI Augmented FullStack Bootcamp hackathon.">
 
  <!-- Fonts: Sora for display/headings, Inter for body/UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
 
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>











  
  













         <!--  TIMER PANEL — Sarah (Timer core: US-1–5)  -->
      <div class="col-12 col-lg-6">
        <section class="panel card bg-body-tertiary border-0 rounded-4 p-4 p-md-5 h-100 d-flex flex-column align-items-center text-center" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="visually-hidden">Focus timer</h2>
  
            <!-- Mode tabs -->
          <div class="nav nav-pills mode-tabs mb-4" role="tablist" aria-label="Timer mode">
            <button type="button" class="nav-link mode-tab is-active" role="tab" aria-selected="true" aria-controls="timer-panel" id="tab-pomodoro" data-mode="pomodoro">Pomodoro</button>
            <button type="button" class="nav-link mode-tab" role="tab" aria-selected="false" aria-controls="timer-panel" id="tab-short" data-mode="short">Short Break</button>
            <button type="button" class="nav-link mode-tab" role="tab" aria-selected="false" aria-controls="timer-panel" id="tab-long" data-mode="long">Long Break</button>
          </div>

<!-- Circular timer -->
          <div class="timer-ring-wrap mb-2" id="timer-panel" role="tabpanel" aria-labelledby="tab-pomodoro" tabindex="0">
            <svg class="timer-ring" viewBox="0 0 220 220" width="220" height="220" aria-hidden="true">
              <circle class="timer-ring__track" cx="110" cy="110" r="98" />
              <circle class="timer-ring__progress" id="ring-progress" cx="110" cy="110" r="98" />
            </svg>
            <div class="timer-display" id="timer-display" role="timer" aria-live="polite" aria-atomic="true">
              25:00
            </div>
          </div>
 
          <p class="session-counter text-subtle mb-4" id="session-counter">Mission 1 of 4</p>
  
            <!-- Controls -->
          <div class="timer-controls d-flex gap-2 mb-4">
            <button type="button" class="btn btn-primary" id="btn-start">Start</button>
            <button type="button" class="btn btn-secondary" id="btn-pause" disabled>Pause</button>
            <button type="button" class="btn btn-outline-light" id="btn-stop">Stop</button>
          </div>
