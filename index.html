<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control | Pomodoro Timer &amp; Mission List</title>
  <meta name="description" content="Mission Control - a Pomodoro focus timer with a mission (task) list, built for the AI Augmented FullStack Bootcamp hackathon.">
 
  <!-- Fonts: Sora for display/headings, Inter for body/UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
 
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>





      <header class="text-center mb-4 mb-md-5">
      <h1 class="app-title d-inline-flex align-items-center gap-2">
        <span class="app-title__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.5c2.5 1.8 4 5 4 8.7 0 1.6-.3 3-.8 4.3l-3.2 3.2-3.2-3.2c-.5-1.3-.8-2.7-.8-4.3 0-3.7 1.5-6.9 4-8.7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="12" cy="10" r="1.6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9 16.5 7 21l3-1.4M15 16.5l2 4.5-3-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Mission Control
      </h1>
      div>
        <button type="button" class="btn btn-link instructions-link p-0" data-bs-toggle="modal" data-bs-target="#instructionsModal">
          How it works
        </button>
      </div>
    </header>

    
    <main class="row g-4">

         <!--  TIMER PANEL — Sarah (Timer core: US-1–5)  -->
      <div class="col-12 col-lg-6">
        <section class="panel card bg-body-tertiary border-0 rounded-4 p-4 p-md-5 h-100 d-flex flex-column align-items-center text-center" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="visually-hidden">Focus timer</h2>
  
            <!-- Mode tabs -->
          <div class="nav nav-pills mode-tabs mb-4" role="tablist" aria-label="Timer mode">
            <button type="button" class="nav-link mode-tab is-active" role="tab" aria-selected="true" aria-controls="timer-panel" id="tab-pomodoro" data-mode="pomodoro">Pomodoro</button>
            <button type="button" class="nav-link mode-tab" role="tab" aria-selected="false" aria-controls="timer-panel" id="tab-short" data-mode="short">Short Break</button>
            <button type="button" class="nav-link mode-tab" role="tab" aria-selected="false" aria-controls="timer-panel" id="tab-long" data-mode="long">Long Break</button>
          </div>

<!-- Circular timer -->
          <div class="timer-ring-wrap mb-2" id="timer-panel" role="tabpanel" aria-labelledby="tab-pomodoro" tabindex="0">
            <svg class="timer-ring" viewBox="0 0 220 220" width="220" height="220" aria-hidden="true">
              <circle class="timer-ring__track" cx="110" cy="110" r="98" />
              <circle class="timer-ring__progress" id="ring-progress" cx="110" cy="110" r="98" />
            </svg>
            <div class="timer-display" id="timer-display" role="timer" aria-live="polite" aria-atomic="true">
              25:00
            </div>
          </div>
 
          <p class="session-counter text-subtle mb-4" id="session-counter">Mission 1 of 4</p>
  
            <!-- Controls -->
          <div class="timer-controls d-flex gap-2 mb-4">
            <button type="button" class="btn btn-primary" id="btn-start">Start</button>
            <button type="button" class="btn btn-secondary" id="btn-pause" disabled>Pause</button>
            <button type="button" class="btn btn-outline-light" id="btn-stop">Stop</button>
          </div>
  
        <!--  Duration settings — Rauhan (Persistence + Settings: US-6, US-12, US-13)  -->
          <details class="settings w-100">
            <summary class="text-subtle">Mission durations</summary>
            <form class="settings__form row g-2 mt-2 justify-content-center" id="settings-form">
              <div class="col-auto">
                <label for="duration-pomodoro" class="form-label small text-subtle mb-1">Pomodoro (min)</label>
                <input type="number" class="form-control form-control-sm" id="duration-pomodoro" name="pomodoro" min="1" max="90" step="1" value="25" inputmode="numeric">
              </div>
              <div class="col-auto">
                <label for="duration-short" class="form-label small text-subtle mb-1">Short Break (min)</label>
                <input type="number" class="form-control form-control-sm" id="duration-short" name="short" min="1" max="30" step="1" value="5" inputmode="numeric">
              </div>
              <div class="col-auto">
                <label for="duration-long" class="form-label small text-subtle mb-1">Long Break (min)</label>
                <input type="number" class="form-control form-control-sm" id="duration-long" name="long" min="1" max="60" step="1" value="15" inputmode="numeric">
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-outline-light btn-sm">Save durations</button>
                <p class="settings__error text-danger small mt-2 mb-0" id="settings-error" role="alert"></p>
              </div>
            </form>
          </details>
          <!--  end Settings — you  -->
 
          <p class="timer-announcer visually-hidden" id="timer-announcer" aria-live="assertive"></p>
        </section>
      </div>

</body>
</html>
